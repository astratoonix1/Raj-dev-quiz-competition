services:
  - type: web
    name: astratoonix-leaderboard
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: astratoonix_quiz
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
